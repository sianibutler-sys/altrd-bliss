<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The iridescent room – Altrd Bliss splash mockup</title><meta name="robots" content="noindex"><link rel="icon" href="../img/favicon-32.png"><style>@font-face{font-family:"Matria Compressed";src:url("https://www.altrdbliss.com/cdn/shop/files/MatriaCompressed-Black.otf?v=4643254518131425102") format("opentype");font-weight:900;font-display:swap}
@font-face{font-family:"Matria Expanded";src:url("https://www.altrdbliss.com/cdn/shop/files/MatriaExpanded-ExtraBold.otf?v=11777718432762818198") format("opentype");font-weight:800;font-display:swap}
@font-face{font-family:"Matria";src:url("https://www.altrdbliss.com/cdn/shop/files/Matria-ExtraBold.otf?v=17149302385647990183") format("opentype");font-weight:800;font-display:swap}
@font-face{font-family:"Supreme LL";src:url("https://cdn.shopify.com/s/files/1/0742/7001/5660/files/SupremeLL-Regular.woff") format("woff"),url("https://www.altrdbliss.com/cdn/shop/files/SupremeLL-Regular.otf?v=10139123942964630977") format("opentype");font-weight:400;font-display:swap}

:root{--rose:#CC3F59;--ember:#E57945;--lavender:#CDB4F9;--lime:#E0F47B;--mint:#B3EDD4;--blue:#415896;--ink:#101618;--cream:#F6F2E7;--fc:"Matria Compressed","Arial Narrow",sans-serif;--fx:"Matria Expanded","Arial Black",sans-serif;--fm:"Matria","Arial Black",sans-serif;--fb:"Supreme LL",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:#fff;font-family:var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0}
a{color:inherit}
.mk{position:fixed;top:12px;left:12px;z-index:50;display:flex;gap:6px;font-size:12px;letter-spacing:.06em}
.mk a{background:rgba(16,22,24,.72);color:#fff;text-decoration:none;padding:7px 12px;border-radius:999px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mk .s{display:none}@media (max-width:600px){.mk .l{display:none}.mk .s{display:inline}.mk a{min-width:34px;text-align:center}}.mk a[aria-current]{background:#fff;color:var(--ink)}
.by{position:fixed;right:16px;bottom:14px;z-index:40;display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;opacity:.7}
.by img{width:52px;height:auto}
.age h2{font:800 clamp(26px,4.4vw,40px)/1 var(--fx);text-transform:uppercase;letter-spacing:-.01em}
.age p{font-size:15px;line-height:1.5}
.age .acts{display:flex;gap:10px;justify-content:center}
.age button{min-width:130px;height:52px;border-radius:999px;font-size:16px}
.age small{font-size:12px;line-height:1.5;opacity:.75}
.age .no{display:none;font-size:14px}
.age.denied .no{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{background:#e9e2f7;color:var(--ink)}
.room{position:fixed;inset:-10%;filter:blur(60px) saturate(1.2);transition:transform 1.4s cubic-bezier(.7,0,.3,1)}
.blob{position:absolute;width:60vmax;height:60vmax;border-radius:50%;opacity:.9;mix-blend-mode:multiply;animation:drift 18s ease-in-out infinite alternate}
.b1{background:var(--lavender);left:-10%;top:-15%}
.b2{background:var(--mint);right:-15%;top:5%;animation-duration:22s;animation-delay:-6s}
.b3{background:var(--lime);left:20%;bottom:-25%;animation-duration:20s;animation-delay:-3s}
.b4{background:#f4a983;right:5%;bottom:-20%;animation-duration:24s;animation-delay:-9s}
.b5{background:#8ea2e3;left:35%;top:20%;width:40vmax;height:40vmax;animation-duration:16s}
.sheen{position:fixed;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,0) 0 6%,rgba(255,255,255,.25) 8%,rgba(255,255,255,0) 11%);mix-blend-mode:soft-light;animation:sheen 9s linear infinite}
@keyframes drift{to{transform:translate(12vw,9vh) scale(1.15)}}
@keyframes sheen{to{background-position:60vw 0}}
.drops{position:fixed;inset:0;pointer-events:none}
.dr{position:absolute;height:var(--h);transform:translate(var(--px,0),var(--py,0)) rotate(var(--r));transition:transform 1.2s cubic-bezier(.7,0,.3,1)}
.dr img{height:100%;width:auto;filter:drop-shadow(0 30px 40px rgba(16,22,24,.25));animation:bob var(--t) ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-22px) rotate(3deg)}}
.d1{left:6%;top:14%;--h:min(58vh,520px);--r:-14deg;--t:4.2s}
.d2{left:22%;top:46%;--h:min(34vh,300px);--r:12deg;--t:3.4s;filter:blur(1.5px)}
.d3{right:20%;top:8%;--h:min(30vh,260px);--r:-8deg;--t:3.8s;filter:blur(2px)}
.d4{right:5%;top:30%;--h:min(62vh,560px);--r:16deg;--t:4.6s}
.center{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:20px;z-index:5}
.logo{width:min(520px,80vw);filter:brightness(0);opacity:0;animation:fade 1s .2s ease forwards}
.age{width:min(440px,100%);display:flex;flex-direction:column;gap:14px;text-align:center;padding:26px 24px;border-radius:24px;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.7);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;animation:fade .9s .7s ease forwards}
.age [data-yes]{background:var(--ink);color:#fff}
.age [data-no]{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.by{color:var(--ink)}.by img{filter:none!important}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (max-width:700px){.d1{left:-6%;top:4%}.d4{right:-6%;top:52%}.d2{left:4%;top:62%}.d3{right:8%;top:2%}}
body.in .d1,body.in .d2{--px:-70vw}
body.in .d3,body.in .d4{--px:70vw}
body.in .room{transform:scale(1.6)}
body.in .center{opacity:0;transform:scale(1.08);transition:opacity .5s,transform .8s}
.white{position:fixed;inset:0;background:#fff;opacity:0;z-index:20;pointer-events:none;transition:opacity .6s .8s}
body.in .white{opacity:1}
</style></head><body><nav class="mk" aria-label="Mockups"><a href="glass.html"><span class="l">1 · Into the glass</span><span class="s">1</span></a><a href="room.html" aria-current="page"><span class="l">2 · The iridescent room</span><span class="s">2</span></a><a href="doors.html"><span class="l">3 · Four mood doors</span><span class="s">3</span></a></nav><div class="room" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i><i class="blob b5"></i></div><div class="sheen" aria-hidden="true"></div>
<div class="drops" aria-hidden="true"><span class="dr d1"><img src="../img/mix/dropper-original.webp" alt=""></span><span class="dr d2"><img src="../img/mix/dropper-tini.webp" alt=""></span><span class="dr d3"><img src="../img/mix/dropper-spritz.webp" alt=""></span><span class="dr d4"><img src="../img/mix/dropper-rita.webp" alt=""></span></div>
<div class="center"><img class="logo" src="https://www.altrdbliss.com/cdn/shop/files/Horizontal_Logo_White.svg?v=1772195683" alt="Altrd Bliss" width="253" height="45"><div class="age" role="dialog" aria-labelledby="ageT"><h2 id="ageT">Are you 21+?</h2><p>Sorry, before we get to the good stuff, we need to check your age.</p><div class="acts"><button data-yes>Yes</button><button data-no>No</button></div><p class="no" role="alert">You must be 21 or older to access this site.</p><small>By entering this site you are agreeing to the Terms of Service and <a href="https://www.altrdbliss.com/policies/privacy-policy" target="_blank" rel="noopener">Privacy Policy</a></small></div></div>
<div class="white" aria-hidden="true"></div><p class="by" aria-hidden="true">Preview by <img src="../siani-creates-logo.png" alt="" style="filter:invert(1)"></p><script>
function setAge(v){document.cookie=`ab_age=${v}; max-age=${30*864e2}; path=/; SameSite=Lax`;try{localStorage.setItem('ab_age',JSON.stringify({v,exp:Date.now()+30*864e5}));sessionStorage.setItem('ab_intro','1')}catch(e){}}
function wire(enter){const g=document.querySelector('.age');g.querySelector('[data-yes]').onclick=()=>{setAge('yes');enter(()=>location.href='../?intro=off#/')};g.querySelector('[data-no]').onclick=()=>{g.classList.add('denied')}}
const ds=[...document.querySelectorAll('.dr')],dep=[1,.5,.35,1.1];
const mv=(x,y)=>ds.forEach((d,i)=>{if(document.body.classList.contains('in'))return;d.style.setProperty('--px',(x*28*dep[i])+'px');d.style.setProperty('--py',(y*28*dep[i])+'px')});
addEventListener('pointermove',e=>mv(e.clientX/innerWidth-.5,e.clientY/innerHeight-.5));
addEventListener('deviceorientation',e=>{if(e.gamma!=null)mv(e.gamma/45,(e.beta-45)/45)});
wire(go=>{ds.forEach(d=>{d.style.removeProperty('--px');d.style.removeProperty('--py')});document.body.classList.add('in');setTimeout(go,1500)});</script></body></html>
