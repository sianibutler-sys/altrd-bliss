:root{--rose:#CC3F59;--ember:#E57945;--lavender:#CDB4F9;--lime:#E0F47B;--mint:#B3EDD4;--blue:#415896;--ink:#101618;--cream:#F6F2E7;--fc:"Matria Compressed","Arial Narrow",sans-serif;--fx:"Matria Expanded","Arial Black",sans-serif;--fm:"Matria","Arial Black",sans-serif;--fb:"Supreme LL",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:#fff;font-family:var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0}
a{color:inherit}
.mk{position:fixed;top:12px;left:12px;z-index:50;display:flex;gap:6px;font-size:12px;letter-spacing:.06em}
.mk a{background:rgba(16,22,24,.72);color:#fff;text-decoration:none;padding:7px 12px;border-radius:999px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mk .s{display:none}@media (max-width:600px){.mk .l{display:none}.mk .s{display:inline}.mk a{min-width:34px;text-align:center}}.mk a[aria-current]{background:#fff;color:var(--ink)}
.by{position:fixed;right:16px;bottom:14px;z-index:40;display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;opacity:.7}
.by img{width:52px;height:auto}
.age h2{font:800 clamp(26px,4.4vw,40px)/1 var(--fx);text-transform:uppercase;letter-spacing:-.01em}
.age p{font-size:15px;line-height:1.5}
.age .acts{display:flex;gap:10px;justify-content:center}
.age button{min-width:130px;height:52px;border-radius:999px;font-size:16px}
.age small{font-size:12px;line-height:1.5;opacity:.75}
.age .no{display:none;font-size:14px}
.age.denied .no{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.film{position:fixed;inset:0;transform-origin:58% 52%;transition:transform 1.3s cubic-bezier(.7,0,.3,1),filter 1.3s}
.film video{width:100%;height:100%;object-fit:cover}
.film::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,22,24,.55),rgba(16,22,24,0) 30%,rgba(16,22,24,0) 50%,rgba(16,22,24,.85))}
.logo{position:fixed;top:clamp(56px,9vh,96px);left:50%;transform:translateX(-50%);width:min(520px,80vw);z-index:5;opacity:0;animation:up 1s .3s ease forwards}
.age{position:fixed;left:50%;bottom:clamp(40px,7vh,72px);transform:translateX(-50%);width:min(440px,calc(100vw - 32px));z-index:6;display:flex;flex-direction:column;gap:14px;text-align:center;padding:26px 24px;border-radius:24px;background:rgba(16,22,24,.38);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);opacity:0;animation:up .9s .9s ease forwards}
.age [data-yes]{background:var(--lime);color:var(--ink)}
.age [data-no]{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4)}
.flood{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 58% 52%,#d9283f,#7a0f22);clip-path:circle(0 at 58% 52%);transition:clip-path 1.1s .35s cubic-bezier(.7,0,.3,1)}
body.in .film{transform:scale(3.2)}
body.in .flood{clip-path:circle(150% at 58% 52%)}
body.in .age,body.in .logo{opacity:0!important;transition:opacity .3s}
@keyframes up{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
